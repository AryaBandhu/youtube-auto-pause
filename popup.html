<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Auto-Pause</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="card">
    <!-- Header -->
    <div class="header">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="24" height="24" rx="6" fill="url(#grad)"/>
          <path d="M9.5 8.5L16 12L9.5 15.5V8.5Z" fill="white"/>
          <defs>
            <linearGradient id="grad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
              <stop stop-color="#FF4444"/>
              <stop offset="1" stop-color="#CC0000"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div class="header-text">
        <h1 class="title">Auto-Pause Pro</h1>
        <p class="subtitle">YouTube Tab & Window Manager</p>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Toggle 1: Auto-pause -->
    <div class="toggle-row">
      <div class="toggle-info">
        <span class="toggle-label">Auto-pause on switch</span>
        <span class="toggle-desc" id="status-text">Loading…</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggle" checked />
        <span class="slider"></span>
      </label>
    </div>

    <!-- Toggle 2: Picture-in-Picture Control -->
    <div class="toggle-row">
      <div class="toggle-info">
        <span class="toggle-label">Picture-in-Picture</span>
        <span class="toggle-desc" id="pip-status-text">OFF — Allow PiP</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="pip-toggle" />
        <span class="slider"></span>
      </label>
    </div>

    <!-- Stats Grid -->
    <div class="stats-row">
      <div class="stat" id="stat-videos-playing">
        <span class="stat-value" id="playing-count">—</span>
        <span class="stat-label">Videos Playing</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat" id="stat-videos-total">
        <span class="stat-value" id="total-count">—</span>
        <span class="stat-label">Videos Detected</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <span class="stat-value" id="stat-state">—</span>
        <span class="stat-label">Status</span>
      </div>
    </div>

    <!-- Info Box -->
    <div class="info-box">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" class="info-icon">
        <circle cx="8" cy="8" r="7.5" stroke="currentColor"/>
        <path d="M8 7v4M8 5.5V5" stroke="currentColor" stroke-linecap="round"/>
      </svg>
      <span>Videos manually paused by you will remain paused upon return.</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
